<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalhes do Cliente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        /* Configurações Gerais e Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Título */
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            width: 100%;
            max-width: 600px; /* Mais estreito para combinar com a ficha */
        }

        /* Card/Ficha do Cliente (Substituindo o comportamento da tabela) */
        .cliente-card {
            width: 100%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* Estilização dos blocos de informação */
        .info-group {
            margin-bottom: 20px;
            border-bottom: 1px solid #edeef2;
            padding-bottom: 12px;
        }

        .info-group:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        /* Rótulos (Ex: Nome, Idade) */
        .info-label {
            font-size: 0.85rem;
            color: #7f8c8d;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }

        /* Valores vindos do banco de dados */
        .info-value {
            font-size: 1.1rem;
            color: #2c3e50;
            font-weight: 500;
        }

        /* Destaque para a seção de Serviços */
        .servico-box {
            background-color: #f8f9fa;
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 0 4px 4px 0;
            margin-top: 10px;
        }

        .servico-vazio {
            background-color: #fdf2f2;
            border-left: 4px solid #e74c3c;
            color: #c0392b;
            padding: 15px;
            border-radius: 0 4px 4px 0;
            margin-top: 10px;
            font-style: italic;
        }

        /* Botão Voltar */
        .btn-voltar {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            transition: background-color 0.2s;
        }

        .btn-voltar:hover {
            background-color: #95a5a6;
        }
    </style>
</head>
<body>

<h1>Detalhes do Cliente</h1>

<div class="cliente-card">

    <div class="info-group">
        <span class="info-label">Nome Completo</span>
        <p class="info-value" th:text="${cliente.nome}"></p>
    </div>

    <div class="info-group">
        <span class="info-label">Idade</span>
        <p class="info-value" th:text="${cliente.idade} + ' anos'"></p>
    </div>

    <div class="info-group">
        <span class="info-label">Telefone</span>
        <p class="info-value" th:text="${cliente.phone}"></p>
    </div>

    <div class="info-group">
        <span class="info-label">Serviço Contratado</span>

        <div th:if="${cliente.servicos}" class="servico-box">
            <p class="info-value">
                <strong th:text="${cliente.servicos.nome}"></strong>
            </p>
            <p style="font-size: 0.9rem; color: #7f8c8d; margin-top: 5px;">
                Dificuldade: <span th:text="${cliente.servicos.dificuldade}" style="font-weight: 600; color: #2c3e50;"></span>
            </p>
        </div>

        <div th:if="${cliente.servicos == null}" class="servico-vazio">
            <span>Cliente sem Serviço cadastrado!</span>
        </div>
    </div>

    <a th:href="@{/clientes/ui/readAll}" class="btn-voltar">Voltar para a lista</a>

</div>

</body>
</html>
