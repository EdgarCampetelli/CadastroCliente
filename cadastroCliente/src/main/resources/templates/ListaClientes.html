<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Clientes</title>
    <link rel="stylesheet" th:href="@{style.css}">
    <style>
        /* Configurações Gerais e Reset de Margens */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            color: #333;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Estilização do Título principal */
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 10px;
            width: 100%;
            max-width: 1200px;
        }

        /* Container da Tabela para permitir rolagem horizontal em telas pequenas */
        table {
            width: 100%;
            max-width: 1200px;
            border-collapse: collapse;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden; /* Garante que as bordas arredondadas funcionem nas pontas */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
        }

        /* Cabeçalho da Tabela */
        thead {
            background-color: #2c3e50;
            color: #ffffff;
        }

        th {
            padding: 15px 20px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        /* Linhas e Células da Tabela */
        tbody tr {
            border-bottom: 1px solid #e9ecef;
            transition: background-color 0.2s ease;
        }

        /* Efeito de "Zebra" intercalando cores de linhas */
        tbody tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        /* Efeito Hover: Destaca a linha onde o mouse está passando */
        tbody tr:hover {
            background-color: #ebf5fb;
        }

        td {
            padding: 15px 20px;
            font-size: 0.9rem;
            vertical-align: middle;
        }

        /* Estilização da coluna de Serviços e Alertas */
        span[th\:if] {
            font-weight: 500;
        }

         /*Destaque para quando o cliente está sem serviço*/
        tbody td span:contains("Cliente sem Servico") {
            color: #e74c3c;
            font-style: italic;
            font-weight: normal;
        }

        /* Estilização dos Botões/Links de Ação */
        td a {
            display: inline-block;
            padding: 6px 12px;
            margin: 2px 4px;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        /* Botão Ver Detalhes (Cinza/Azul sutil) */
        td a:nth-child(1) {
            background-color: #ecf0f1;
            color: #7f8c8d;
        }

        td a:nth-child(1):hover {
            background-color: #bdc3c7;
            color: #2c3e50;
        }

        /* Botão Alterar (Amarelo/Laranja de atenção) */
        td a:nth-child(2) {
            background-color: #f39c12;
            color: white;
        }

        td a:nth-child(2):hover {
            background-color: #d35400;
        }

        /* Botão Deletar (Vermelho de perigo) */
        td a[th\:href*="delete"], td a:nth-child(3) {
            background-color: #e74c3c;
            color: white;
        }

        td a[th\:href*="delete"]:hover, td a:nth-child(3):hover {
            background-color: #c0392b;
        }

        /* Responsividade Básica para telas menores */
        @media (max-width: 768px) {
            body {
                padding: 20px 10px;
            }

            th, td {
                padding: 10px 12px;
                font-size: 0.85rem;
            }

            td a {
                padding: 4px 8px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <h1>LISTA DE CLIENTES</h1>
    <table>
        <thead>
        <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>Servicos</th>
        </tr>
        </thead>
        <tbody>
            <tr th:each ="cliente: ${clientes}">
                <td th:text="${cliente.nome}"> </td>
                <td th:text="${cliente.idade}"> </td>
                <td th:text="${cliente.email}"> </td>
                <td th:text="${cliente.phone}"> </td>
                <td>
                    <span th:if="${cliente.servicos}">
                        <span th:text="${cliente.servicos.nome}"></span>,
                        Dificuldade:
                        <span th:text="${cliente.servicos.dificuldade}"></span>
                    </span>
                    <span th:if="${cliente.servicos == null}">
                        Cliente sem Servico !
                    </span>
                </td>

                <td>
                    <a th:href="@{/clientes/ui/read/{id}(id=${cliente.id})}">Ver detalhes</a>
                    <a th:href="@{/clientes/ui/1/{id}(id=${cliente.id})}">Alterar</a>
                    <a th:href="@{/clientes/ui/delete/{id}(id=${cliente.id})}">Deletar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <a th:href="@{/clientes/ui/pg-create}" class="btn-voltar">Cadastrar</a>
</body>
</html>
